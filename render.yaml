services:
  - type: worker
    name: quant-desk-discord-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python discord_monitor.py --interval 30
    buildFilter:
      ignoredPaths:
        - monitor_data/**
    envVars:
      - key: TRADYTICS_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: MONITOR_GITHUB_REPO
        sync: false
      - key: MONITOR_GITHUB_TOKEN
        sync: false
      - key: MONITOR_GITHUB_BRANCH
        value: main
      - key: TRADYTICS_AUTH_MODE
        value: query
      - key: MONITOR_PRICE_SOURCE
        value: Auto
